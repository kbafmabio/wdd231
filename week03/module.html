<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module example: courses and sections</title>
    <link rel="stylesheet" href="styles/module.css">
    <script src="scripts/module.mjs" defer></script>
</head>

<body>
    <main>

        <h1 id="courseName">Web Frontend Development I</h1>
        <h2 id="courseCode">WDD231</h2>
        <div id="enrollment">
            <label for="sectionNumber">Choose a Section </label>
            <select id="sectionNumber" name="sectionNumber">
                <option value="0">Section 0</option>
                <option value="1">Section 1</option>
                <option value="2">Section 2</option>
                <option value="3">Section 3</option>
            </select>
            <button id="enrollstudent">Enroll a Student</button>
            <button id="dropStudent">Drop a Student</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Section</th>
                    <th>Enrolled</th>
                    <th>Instructor</th>
                </tr>
            </thead>
            <tbody id="sections">
                <tr>
                    <td>1 </td>
                    <td>88</td>
                    <td>Brother Bingham</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>81</td>
                    <td>Sister Shultz</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>95</td>
                    <td>Sister Smith</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
